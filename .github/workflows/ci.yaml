name: ci

# Each job is one `make` target on a GitHub-hosted macOS runner, where `make
# deps` finds Homebrew. Lint starts when style is green, the build and the
# unit tests when lint is, and the end-to-end test when the unit tests are.
#
# `branches` is spelled out: a bare `push:` also matches tags.
#
# One run at a time for a branch, so a burst of pushes does not queue macOS
# jobs behind each other. A push that arrives while another waits takes its
# place.
on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  style:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: make deps
      - run: make style

  lint:
    needs: style
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: make deps
      - run: make lint

  build:
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: make deps
      - run: make build

  test-unit:
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: make deps
      - run: make test-unit

  test-e2e:
    needs: test-unit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: make deps
      - run: make test-e2e
